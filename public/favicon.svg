<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Blue rounded background -->
  <rect width="32" height="32" rx="8" fill="#2563EB"/>
  <!-- Basket handle (arc) -->
  <path d="M10 15 Q10 8 16 8 Q22 8 22 15" stroke="white" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- Basket body -->
  <rect x="7" y="15" width="18" height="11" rx="2.5" fill="white" fill-opacity="0.95"/>
  <!-- Vertical weave lines -->
  <line x1="12" y1="15" x2="12" y2="26" stroke="#2563EB" stroke-width="1.4" stroke-opacity="0.4"/>
  <line x1="16" y1="15" x2="16" y2="26" stroke="#2563EB" stroke-width="1.4" stroke-opacity="0.4"/>
  <line x1="20" y1="15" x2="20" y2="26" stroke="#2563EB" stroke-width="1.4" stroke-opacity="0.4"/>
  <!-- Horizontal mid line -->
  <line x1="7" y1="20.5" x2="25" y2="20.5" stroke="#2563EB" stroke-width="1.4" stroke-opacity="0.4"/>
</svg>